<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Account Activation Code</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				background-color: #f4f6f8;
				padding: 30px;
				color: #333;
			}
			.container {
				max-width: 600px;
				background-color: #ffffff;
				padding: 25px;
				margin: auto;
				border-radius: 8px;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
			}
			.code-box {
				font-size: 28px;
				letter-spacing: 8px;
				text-align: center;
				background-color: #f0f3f7;
				padding: 15px 20px;
				border: 2px dashed #007bff;
				color: #007bff;
				font-weight: bold;
				margin: 30px 0;
				border-radius: 8px;
			}
			.footer {
				font-size: 0.85em;
				color: #888;
				margin-top: 30px;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h2>Hello, {user_name}!</h2>
			<p>
				Thank you for signing up. To complete your registration, please
				use the activation code below:
			</p>

			<div class="code-box">{activation_code}</div>

			<p>If you did not request this, please ignore this message.</p>
		</div>
	</body>
</html>
